<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AliMart - Belanja Produk Pilihan</title>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

  <nav class="nav">

    <div class="nav-links">
      <a href="index.html" aria-current="page">Belanja</a>
      <a href="form.html">Daftar Member</a>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Ganti mode tampilan" title="Ganti mode tampilan">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>

  </nav>

  <header class="hero">
    <p class="eyebrow">Koleksi Terbaru</p>

  </header>

  <section class="toolbar">
    <label for="searchInput" class="sr-only">Cari produk</label>
    <input type="search" id="searchInput" placeholder="Cari produk atau kategori..." disabled>
    <span id="resultCount" class="count" aria-live="polite"></span>
  </section>

  <main>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <div id="productGrid" class="grid"></div>
  </main>

  <footer class="footer">
    &copy; 2026 AliMart &middot; Belanja mudah, aman, dan nyaman
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/product.js"></script>

</html>
