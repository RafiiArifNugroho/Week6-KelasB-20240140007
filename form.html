<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Member - AliMart</title>
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>

  <nav class="nav">
    <a class="brand" href="index.html"><svg class="brand-logo" viewBox="0 0 48 48" width="32" height="32" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#F2B541"/><path d="M18 20V17a6 6 0 0 1 12 0V20" fill="none" stroke="#094d4d" stroke-width="3" stroke-linecap="round"/><path d="M13 20H35L36.5 38a3 3 0 0 1-3 3.2H14.5a3 3 0 0 1-3-3.2Z" fill="#094d4d"/><path d="M19 29q5 5 10 0" fill="none" stroke="#F2B541" stroke-width="2.6" stroke-linecap="round"/></svg><span>AliMart</span></a>
    <div class="nav-links">
      <a href="index.html">Belanja</a>
      <a href="form.html" aria-current="page">Daftar Member</a>
    </div>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Ganti mode tampilan" title="Ganti mode tampilan">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </nav>

  <header class="hero">
    <p class="eyebrow">Keanggotaan</p>
    <h1>Daftar Jadi Member</h1>
    <p class="lead">Gabung sekarang dan nikmati promo eksklusif, poin belanja, serta gratis ongkir untuk member.</p>
  </header>

  <main class="form-layout">

    <form id="registerForm" novalidate>

      <div class="field">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" placeholder="Nama sesuai identitas" autocomplete="name" aria-describedby="nama-error">
        <small class="error" id="nama-error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="contoh: nama@email.com" autocomplete="email" aria-describedby="email-error">
        <small class="error" id="email-error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-row">
          <input type="password" id="password" name="password" placeholder="minimal 8 karakter" autocomplete="new-password" aria-describedby="password-error">
          <button type="button" id="togglePassword" class="ghost-btn" aria-controls="password">Tampilkan</button>
        </div>
        <div class="strength" aria-hidden="true">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <small class="hint" id="strengthText">Kekuatan password: -</small>
        <small class="error" id="password-error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="konfirmasi">Konfirmasi Password</label>
        <input type="password" id="konfirmasi" name="konfirmasi" placeholder="ulangi password" autocomplete="new-password" aria-describedby="konfirmasi-error">
        <small class="error" id="konfirmasi-error" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="minat">Kategori Favorit</label>
        <select id="minat" name="minat">
          <option value="Fashion">Fashion &amp; Aksesori</option>
          <option value="Elektronik">Elektronik</option>
          <option value="Rumah">Rumah &amp; Furnitur</option>
          <option value="Kecantikan">Kecantikan &amp; Perawatan</option>
        </select>
      </div>

      <div class="field">
        <label class="check">
          <input type="checkbox" id="setuju" name="setuju" aria-describedby="setuju-error">
          <span>Saya setuju dengan syarat dan ketentuan keanggotaan</span>
        </label>
        <small class="error" id="setuju-error" aria-live="polite"></small>
      </div>

      <div class="actions">
        <button type="submit" class="primary-btn">Daftar Sekarang</button>
        <button type="reset" class="ghost-btn" id="resetBtn">Reset</button>
      </div>
    </form>

    <aside class="result-panel" aria-live="polite">
      <div id="formMessage" class="form-message" hidden></div>
      <div id="resultCard" class="result-card" hidden></div>
      <p id="placeholderText" class="placeholder">Ringkasan keanggotaanmu akan tampil di sini.</p>
    </aside>

  </main>

  <footer class="footer">
    &copy; 2026 AliMart &middot; Belanja mudah, aman, dan nyaman
  </footer>

  <script src="js/theme.js"></script>
  <script src="js/form.js"></script>
</body>
</html>
